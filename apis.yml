aid: edvisorio
name: Edvisor.io
description: >-
  Edvisor.io is a B2B international-education recruitment platform that connects
  education agencies with 700+ partner schools across 80+ countries. Agencies browse
  school portfolios with live pricing, build and send student quotes, manage the
  student journey from inquiry through enrollment, and track commissions and invoices;
  schools distribute programs to 5,000+ active agencies, grow and manage their agency
  network, and analyze their enrollment pipeline. The platform has processed over $2B
  in tuition. Edvisor exposes a GraphQL API at api-v2.edvisor.io/graphql (226 queries,
  203 mutations, Bearer API-key auth) plus webhooks for two-way synchronization with
  external CRM and back-office systems.
